version: "3.8"

services:
  stayease-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stayease_agent_os
    restart: unless-stopped
    ports:
      - "8501:8501"  # Streamlit AI Operating System Cockpit
      - "8000:8000"  # FastAPI Operations API & Swagger Docs
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_URL=http://127.0.0.1:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      # Mount SQLite database and backup file for persistence across container restarts
      - ./hotel.db:/app/hotel.db
      - ./invoices.dat:/app/invoices.dat
      - ./logs:/app/logs

